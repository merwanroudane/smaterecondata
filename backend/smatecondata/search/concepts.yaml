# SmatEconData multilingual concept aliases (spec 0B.1).
#
# These are DISCOVERY AIDS. They map what a researcher types onto an internal
# concept key; the series that comes back always keeps its official provider
# title, code, unit and definition. Nothing here overwrites provider metadata.
#
# `ambiguous: true` marks a concept whose plain name has several materially
# different definitions -- the ambiguity engine (spec 6.3) must offer a choice
# rather than silently picking one.

concepts:
  - key: gdp
    label: Gross domestic product
    topic: Economic Growth
    ambiguous: true
    distinctions:
      - current local currency
      - current USD
      - constant prices
      - purchasing power parity (PPP)
      - growth rate
      - per capita
    aliases:
      en: [GDP, gross domestic product, national output, domestic product]
      fr: [PIB, produit interieur brut, production nationale]
      ar: [الناتج المحلي الإجمالي, الناتج الداخلي الخام, الناتج المحلي, الناتج الاجمالي]

  - key: gdp_per_capita
    label: GDP per capita
    topic: Economic Growth
    aliases:
      en: [GDP per capita, gdp per head, income per capita, output per person]
      fr: [PIB par habitant, PIB par tete, revenu par habitant]
      ar: [الناتج المحلي الإجمالي للفرد, نصيب الفرد من الناتج المحلي, دخل الفرد]

  - key: gdp_growth
    label: GDP growth rate
    topic: Economic Growth
    aliases:
      en: [GDP growth, economic growth, growth rate, real growth]
      fr: [croissance du PIB, croissance economique, taux de croissance]
      ar: [نمو الناتج المحلي, النمو الاقتصادي, معدل النمو]

  - key: inflation
    label: Inflation
    topic: Prices & Inflation
    ambiguous: true
    distinctions:
      - CPI inflation, annual percent
      - GDP deflator inflation
      - monthly CPI index
      - core inflation
      - end-of-period inflation
      - period-average inflation
    aliases:
      en: [inflation, CPI inflation, consumer prices, price inflation, cost of living]
      fr: [inflation, hausse des prix, prix a la consommation, indice des prix]
      ar: [التضخم, معدل التضخم, ارتفاع الأسعار, أسعار المستهلك, غلاء المعيشة]

  - key: cpi
    label: Consumer price index
    topic: Prices & Inflation
