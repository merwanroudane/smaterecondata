      - male / female unemployment
      - modelled ILO estimate vs national estimate
    aliases:
      en: [unemployment, unemployment rate, jobless rate, joblessness]
      fr: [chomage, taux de chomage, sans emploi]
      ar: [البطالة, معدل البطالة, نسبة البطالة, العاطلون عن العمل]

  - key: employment
    label: Employment
    topic: Labor Market
    aliases:
