      fr: [IPC, indice des prix a la consommation]
      ar: [مؤشر أسعار المستهلك, الرقم القياسي للأسعار]

  - key: unemployment
    label: Unemployment rate
    topic: Labor Market
    ambiguous: true
    distinctions:
